services:
  db:
    image: postgres:15
    container_name: wim_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wim
      POSTGRES_PASSWORD: wim
      POSTGRES_DB: wim
    ports:
      - "5432:5432"
    volumes:
      - wim_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wim -d wim"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: wim_api_image
    container_name: wim_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://wim:wim@db:5432/wim
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npx prisma generate --schema=/app/apps/api/prisma/schema.prisma && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy

migrate:
  image: wim_api_image
  container_name: wim_migrate
  restart: "no"
  working_dir: /app/apps/api
  depends_on:
    db:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql://wim:wim@db:5432/wim
  command: sh -c "npx prisma generate --schema=prisma/schema.prisma && npx prisma migrate deploy --schema=prisma/schema.prisma"

env_file:
  - .env.docker

volumes:
  wim_pg:
  node_modules: