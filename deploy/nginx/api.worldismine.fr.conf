# Reverse proxy nginx pour l'API WIM.
#
# Installation sur le VPS :
#   sudo cp deploy/nginx/api.worldismine.fr.conf /etc/nginx/sites-available/api.worldismine.fr
#   sudo ln -s /etc/nginx/sites-available/api.worldismine.fr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.worldismine.fr
#
# Ce fichier ne déclare que le bloc HTTP : `certbot --nginx` ajoute lui-même le
# bloc 443 avec les certificats et la redirection. Y mettre du TLS à la main
# avant que le certificat existe empêcherait nginx de recharger.

# socket.io a besoin que l'en-tête Connection devienne "upgrade" sur un handshake
# WebSocket, et "close" sinon. Nom préfixé `wim_` : une `map` est globale au
# contexte http, un nom générique entrerait en conflit avec les autres sites.
map $http_upgrade $wim_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.worldismine.fr;

    # Doit couvrir les photos de logements et avatars envoyés via multer.
    client_max_body_size 25M;

    # En-têtes de sécurité de base pour une API consommée par le web et le mobile.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # Port publié par le conteneur sur la loopback (API_HOST_PORT).
        proxy_pass http://127.0.0.1:3010;

        # HTTP/1.1 + ces deux en-têtes : sans eux, le handshake socket.io échoue
        # et le client retombe indéfiniment sur le polling.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wim_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une connexion WebSocket inactive ne doit pas être coupée au bout des
        # 60 s par défaut.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Le streaming socket.io ne doit pas être mis en tampon par nginx.
        proxy_buffering off;
    }
}
