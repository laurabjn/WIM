name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verification:
    name: Types et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      # Le typage de l'API dépend du client Prisma, qui est généré et non
      # versionné : sans cette étape, la vérification échoue sur des types
      # absents plutôt que sur le code.
      - name: Générer le client Prisma
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Vérifier les types
        run: npm run check-types

      - name: Analyser le code
        run: npm run lint

      - name: Lancer les tests
        run: npm run test
