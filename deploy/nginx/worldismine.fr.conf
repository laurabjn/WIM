# Site statique de WIM : pages légales, page de retour de la vérification
# d'identité, et les fichiers que les systèmes mobiles viennent lire pour
# associer le domaine à l'application.
#
# Installation sur le VPS :
#   sudo cp deploy/nginx/worldismine.fr.conf /etc/nginx/sites-available/worldismine.fr
#   sudo ln -s /etc/nginx/sites-available/worldismine.fr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d worldismine.fr -d www.worldismine.fr
#
# Comme pour l'API, ce fichier ne déclare que le bloc HTTP : `certbot --nginx`
# ajoute lui-même le bloc 443 et la redirection.

server {
    listen 80;
    listen [::]:80;
    server_name worldismine.fr www.worldismine.fr;

    root /opt/wim/deploy/site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Android vient lire ce fichier pour vérifier que l'application a le droit
    # d'ouvrir les liens du domaine. Il doit répondre en JSON, sans redirection
    # ni authentification, sinon la vérification échoue en silence et les liens
    # retombent dans le navigateur.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # Même règle pour iOS, le jour où le fichier sera ajouté.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # Adresse de retour de la vérification d'identité, déclarée dans
    # l'application comme lien vérifié : sans extension dans l'URL.
    location = /verification-identite {
        try_files /verification-identite.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
