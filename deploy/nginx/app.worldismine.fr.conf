# Reverse proxy nginx pour le site WIM (Next.js).
#
# Installation sur le VPS :
#   sudo cp deploy/nginx/app.worldismine.fr.conf /etc/nginx/sites-available/app.worldismine.fr
#   sudo ln -s /etc/nginx/sites-available/app.worldismine.fr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.worldismine.fr
#
# Comme pour l'API, ce fichier ne déclare que le bloc HTTP : `certbot --nginx`
# ajoute lui-même le bloc 443 avec les certificats et la redirection.

server {
    listen 80;
    listen [::]:80;
    server_name app.worldismine.fr;

    # Les pages sont rendues par le serveur à chaque requête : les en-têtes de
    # sécurité se posent ici plutôt que dans le code.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les fichiers construits par Next portent une empreinte dans leur nom :
    # ils ne changent jamais pour une même adresse, donc on les laisse en cache
    # un an. C'est ce qui rend les visites suivantes instantanées.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Port publié par le conteneur sur la loopback (WEB_HOST_PORT).
        proxy_pass http://127.0.0.1:3020;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next sait rendre une page lente quand l'API traîne ; mieux vaut
        # attendre que couper au milieu d'un rendu.
        proxy_read_timeout 60s;
    }
}
